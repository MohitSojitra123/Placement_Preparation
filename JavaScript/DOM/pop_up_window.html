<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body{
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

button{
    width: 150px;
    height: 50px;
    font-size: 22px;
    background-color: turquoise;
    border-radius: 20px;
    border: none;
    transition: 0.5s;
}

button:hover{
    background-color: blueviolet;
    transition: 0.5s;
}

.pop1{
    width: 450px;
    height: 450px;
    border-radius:50px;
    background-color: skyblue;
    box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
    display: flex;
   justify-content: center;
   align-items: center;
}

.pop2{
    display: none;
}
.content{
    width: 400px;
    height: 400px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    flex-direction: column;
    padding-inline: 20px;
}

.content h2{
    font-size: 40px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    text-align: center;
}


.detail label{
    font-size: 25px;
    font-family: Arial, Helvetica, sans-serif;  
}

.detail input{
    border: none;
    width: 100%;
    height: 12%;
    border-radius: 50px;
    margin: 20px 0px;
    outline: none;
    padding-inline: 5px;
    box-sizing: border-box;
    font-size: 25px;
}

.detail button{
    margin-left: 20px;
}
</style>
<body>
    <button id="qwe">
        LogIn
    </button>

    <div class="pop2" id="xyz">
      
        <div class="content">

            <h2>Log-In</h2>

            <div class="detail">
                <label for="">User Name</label>
                <input type="text">
                <label for="">Password</label>
                <input type="password">
                <button>
                    Log in
                </button>   
                <button id="btn2">
                   Cancle
                </button>
            </div>
        </div>
    </div>
</body>
<script>

let btn=document.getElementById('qwe');
let btn2=document.getElementById('btn2');
let xyz=document.getElementById("xyz");

btn.addEventListener('click',function(){   
        if(xyz.classList == 'pop2'){
             xyz.setAttribute('class','pop1')
             btn.style.display="none";
            }
})

btn2.addEventListener("click",function(){
    if(xyz.classList == 'pop1'){
      xyz.setAttribute('class','pop2')
      btn.style.display="block";
    }
})




</script>
</html>
