<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

*{
    padding: 0px;
    margin: 0px;
    box-sizing: border-box;
}

main{
    width: 100vw;
    height: 100vh;
    background-color: antiquewhite;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
}

#btn_1{
    width: 150px;
    height: 40px;
    font-size: 20px;
    z-index: 11;
}

.container_1{
    width: 400px;
    height: 150px;
    padding: 15px;
    background-color: aqua;
    z-index: 10;
}

.hide{
    display: none;

}

.btn_2{
   width: 90px;
    font-size: 16px;
   height: 30px;
   margin-top: 15px;
}

.overly{
    width: 100%;
    height: 100%;
    background-color: yellowgreen;
    position: absolute;
    z-index: 10;
}

</style>
<body>
    <main>
        <div class="overly"></div>
        <button id="btn_1">Click Me</button>
        <div class="container_1 hide" id="con_1">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aperiam fugiat ratione dolorum facere, totam id quidem itaque omnis sit beatae odio. Nulla atque laboriosam recusandae dignissimos vero! Beatae, labore commodi.
            <button class="btn_2">Ok</button>
            <button class="btn_2">Cancle</button>
        </div>
    </main>
</body>
<script>

let btn_1=document.getElementById("btn_1");
let container_1=document.querySelector(".container_1");
let overly=document.querySelector(".overly");


btn_1.addEventListener("click",function(){
    container_1.classList.remove("hide");
    btn_1.classList.add("hide");
})


overly.addEventListener("click",function(e){
    let cl=e.target.classList;
    console.log(cl);
    if(cl.contains("overly")){
        container_1.classList.add('hide');
        btn_1.classList.remove("hide");
    }
})

</script>
</html>
