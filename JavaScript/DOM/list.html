<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="ul_1">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
</body>
<script>
    let ul_1=document.querySelectorAll("#ul_1 li");
    console.log(ul_1);

    const new_li_1=document.createElement("li");
    new_li_1.textContent="item 5";
    
    let ul=document.getElementById("ul_1");
    ul.append(new_li_1);

</script>
</html>
